<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expo Control</title>
    <meta name="theme-color" content="#0b7a53" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="control-page">
    <main class="control">
      <header class="board__header">
        <div class="brand">
          <img class="brand__mark" src="icons/icon.svg" alt="" />
          <div>
            <h1>Expo control</h1>
            <p class="tagline">Is everything ready, and what's used up today</p>
          </div>
        </div>
        <div class="board__side">
          <a class="chip chip--back" href="./">Back to the planner</a>
          <p class="board__updated" id="control-updated" aria-live="polite"></p>
        </div>
      </header>

      <section class="control__card" aria-labelledby="ready-title">
        <h2 id="ready-title">Ready for visitors</h2>
        <ul id="ready" class="control__checks"></ul>
      </section>

      <section class="control__card" aria-labelledby="usage-title">
        <h2 id="usage-title">Used today</h2>
        <div id="usage" class="control__usage"></div>
      </section>

      <section class="control__card" aria-labelledby="booth-title">
        <h2 id="booth-title">The booth</h2>
        <p id="today" class="control__today"></p>
        <div class="control__actions">
          <button id="demo-toggle" class="button" type="button">Pause demo mode</button>
          <button id="reset-stats" class="button button--ghost" type="button">Restart today's stats</button>
        </div>
        <p id="control-message" class="control__message" role="status"></p>
        <label class="field control__code">
          <span class="field__label">Admin code (when the server has ROUTES_ADMIN_CODE)</span>
          <input id="admin-code" type="password" autocomplete="off" />
        </label>
        <p class="control__links">
          Open: <a href="./?demo=1">the booth screen (demo mode)</a> · <a href="stats.html">the stats screen</a> ·
          <a href="answers.html">visitors' answers</a> · <a href="game.html">the game</a> · <a href="./">the planner</a> ·
          <a href="health">the server's full health</a>
        </p>
      </section>
    </main>
    <script src="control.js" type="module"></script>
  </body>
</html>
